# Seed vetoes distilled from a personal CLAUDE.md
# Copy to ~/.claude/nodloop/vetoes.yaml for every project or to .claude/nodloop/vetoes.yaml at a project root for that project
#
# The Bash patterns match the field commands that the guard derives from command through a shell parser
#   one line per simple command in the order the shell runs them, also inside if, loops, pipes and substitutions
#   a line holds the command name and its arguments without leading VAR=value assignments or redirections
#   quotes and backslashes are removed, a word holding a space comes back quoted and a part that expands renders as $
#   a subshell or a substitution opens with a line ( and closes with a line )
#   the command find runs through -exec, -execdir, -ok or -okdir is a line of its own
# Each Bash pattern starts a line with one prefix of wrappers, assignments, durations and options
#   the wrappers are builtin command doas env exec nice nohup stdbuf sudo time timeout xargs
#   any option of a wrapper may take the next word so -Eu root and -n 1 need no list of letters
# Monitor runs a shell command under the same field so every Bash veto covers it too
# Limits
# 1. variables, aliases, functions and a command name the shell computes are matched as written
# 2. the string given to bash -c or eval is not parsed so the seeds block those forms outright
# 3. any option of a wrapper may take the next word so sudo -E nodloop eval is blocked
# 4. text that neither bash nor zsh parses is matched as written line by line
# 5. any sed option cluster holding i or the BSD I counts as in place so -ei with a script named i is blocked too
vetoes:
  - id: no-sed-inplace
    tool: Bash|Monitor
    when:
      - field: commands
        match: |-
          (?m)^((builtin|command|doas|env|exec|nice|nohup|stdbuf|sudo|time|timeout|xargs|[A-Za-z_][A-Za-z0-9_]*=\S*|[0-9.]+[smhd]?) |-\S* (\S+ )?)*?(\S*/)?(sed( ('[^']*'|"[^"]*"|\$'[^']*'|[^'"\s]\S*))*? (-[A-Za-z]*[iI]\S*|--in-place\S*)|perl( ('[^']*'|"[^"]*"|\$'[^']*'|[^'"\s]\S*))*? -[^\s'"MmIeEdxF]*i\S*)( |$)
    reason: sed -i and perl -i are forbidden. Use the Edit tool to modify files
    source: personal CLAUDE.md

  - id: no-eval
    tool: Bash|Monitor
    when:
      - field: commands
        match: |-
          (?m)^((builtin|command|doas|env|exec|nice|nohup|stdbuf|sudo|time|timeout|xargs|[A-Za-z_][A-Za-z0-9_]*=\S*|[0-9.]+[smhd]?) |-\S* (\S+ )?)*?(\S*/)?eval( |$)
    reason: eval is forbidden. Run the command directly or use python3 -c
    source: personal CLAUDE.md

  - id: no-shell-c
    tool: Bash|Monitor
    when:
      - field: commands
        match: |-
          (?m)^((builtin|command|doas|env|exec|nice|nohup|stdbuf|sudo|time|timeout|xargs|[A-Za-z_][A-Za-z0-9_]*=\S*|[0-9.]+[smhd]?) |-\S* (\S+ )?)*?(\S*/)?(bash|sh|zsh|dash|ksh)( ([-+][A-Za-z]*[oO][A-Za-z]* \S+|--(rcfile|init-file) \S+|[-+]\S*))* -[A-Za-z]*c[A-Za-z]*( |$)
    reason: bash -c and sh -c are forbidden. Run the command directly or use python3 -c
    source: personal CLAUDE.md

  - id: no-cd-then-git
    tool: Bash|Monitor
    when:
      - field: commands
        match: |-
          (?m)^cd( .*)?$(\n([^()\n].*)?|\n\((\n([^()\n].*)?|\n\((\n([^()\n].*)?)*\n\))*\n\)|\n\()*\n((builtin|command|doas|env|exec|nice|nohup|stdbuf|sudo|time|timeout|xargs|[A-Za-z_][A-Za-z0-9_]*=\S*|[0-9.]+[smhd]?) |-\S* (\S+ )?)*?(\S*/)?git( --?[^C\s]\S*)*( [^-\s]| *$)
    reason: cd X && git is forbidden because allow rules apply per segment. Use git -C X instead
    source: personal CLAUDE.md

  - id: no-readme
    tool: Write
    when:
      - field: file_path
        match: '(?i)(^|/)README(\.[a-z]+|([._-][\w-]+)*\.(md|markdown|mdx|rst|txt|adoc|asciidoc|org|textile|rdoc|html?))?$'
        unless: 'node_modules/'
    reason: Do not create README files
    source: personal CLAUDE.md
