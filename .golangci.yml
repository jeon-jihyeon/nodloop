version: "2"
linters:
  enable:
    - depguard
    - dupl
    - funlen
    - gocritic
    - gocyclo
    - nakedret
    - revive
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 70
      statements: 50
    dupl:
      threshold: 120
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: comment-spacings
          disabled: true
        - name: exported
          disabled: true
    # Packages import downward only: domain → application → infra → controllers
    # record holds the shapes the stores read and write and imports nothing of the module
    # Stores and adapters take and return those shapes and never import the model they keep
    # knowledge is the ledger and the application packages sit above it
    # compact and extract are imported by mcp and cmd and the server
    # loop and retain are imported by those and the nodloop package at the module root
    # consolidate is imported by cmd alone
    # curate is imported by mcp and cmd and the server and the nodloop package
    # Application packages never import each other
    # markfile holds the mark file and its lock that consolidate, curate, retain and otel share since they cannot import each other
    # markfile imports nothing of the module so it sits in the domain below the application packages
    # schema reads the published record schemas and textkey holds the HMAC key
    # Both sit in infrastructure
    # datapackage writes a Data Package folder from fields and rows and imports nothing of the module
    # No package imports a producer: a producer reaches the core through the MCP tools or the CLI
    # cmd/nodloop is the composition root and imports everything
    # Test files may reach the testkit harness and the file stores so $test is left out where that matters
    depguard:
      rules:
        domain:
          files:
            - "**/internal/feedback/**"
            - "**/internal/trace/**"
            - "**/internal/llm/**"
            - "**/internal/veto/**"
            - "**/internal/call/**"
            - "**/internal/settings/**"
            - "**/internal/jsonl/**"
            - "**/internal/atomicfile/**"
            - "**/internal/classify/**"
            - "**/internal/userconfig/**"
            - "**/internal/markfile/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/knowledge
              desc: domain packages do not import knowledge
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: domain packages do not import compact
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: domain packages do not import extract
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: domain packages do not import loop
            - pkg: github.com/jeon-jihyeon/nodloop/internal/retain
              desc: domain packages do not import retain
            - pkg: github.com/jeon-jihyeon/nodloop/internal/consolidate
              desc: domain packages do not import consolidate
            - pkg: github.com/jeon-jihyeon/nodloop/internal/curate
              desc: domain packages do not import curate
            - pkg: github.com/jeon-jihyeon/nodloop/internal/replay
              desc: domain packages do not import replay
            - pkg: github.com/jeon-jihyeon/nodloop/internal/otel
              desc: domain packages never send telemetry
            - pkg: github.com/jeon-jihyeon/nodloop/internal/datapackage
              desc: domain packages never write a Data Package
            - pkg: github.com/jeon-jihyeon/nodloop/internal/guard
              desc: domain packages do not import guard
            - pkg: github.com/jeon-jihyeon/nodloop/internal/mcp
              desc: domain packages do not import mcp
            - pkg: github.com/jeon-jihyeon/nodloop/internal/testkit
              desc: domain packages do not import the test harness
            - pkg: github.com/jeon-jihyeon/nodloop/cmd
              desc: nothing imports cmd
        record:
          files:
            - "**/internal/record/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/
              desc: record holds plain shapes and imports no package of the module
        infrastructure:
          files:
            - "**/internal/trace/file/**"
            - "**/internal/feedback/file/**"
            - "**/internal/knowledge/file/**"
            - "**/internal/otel/**"
            - "**/internal/schema/**"
            - "**/internal/textkey/**"
            - "**/internal/pg/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/trace$
              desc: stores and adapters take and return shapes of their own and the caller converts them into traces
            - pkg: github.com/jeon-jihyeon/nodloop/internal/feedback$
              desc: stores and adapters take and return shapes of their own and the caller converts them into verdicts and outcomes
            - pkg: github.com/jeon-jihyeon/nodloop/internal/knowledge$
              desc: stores and adapters take and return shapes of their own and the ledger converts them into knowledge
            - pkg: github.com/jeon-jihyeon/nodloop/internal/retain$
              desc: a store keeps the prune mark as a record shape and retain converts it
            - pkg: github.com/jeon-jihyeon/nodloop/internal/mcp
              desc: infrastructure sits below the controllers
            - pkg: github.com/jeon-jihyeon/nodloop/internal/guard
              desc: infrastructure sits below the controllers
            - pkg: github.com/jeon-jihyeon/nodloop/cmd
              desc: nothing imports cmd
        datapackage:
          files:
            - "**/internal/datapackage/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/
              desc: the Data Package writer takes fields and rows and imports no package of the module
        terminal:
          files:
            - "**/internal/terminal/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/
              desc: terminal reads the streams and the environment it is handed and imports no package of the module
        published:
          files:
            - "**/schema/schema.go"
            - "!**/internal/schema/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/
              desc: the published files embed no code of the module
        textkey:
          files:
            - "**/internal/feedback/**"
            - "**/internal/trace/**"
            - "**/internal/llm/**"
            - "**/internal/veto/**"
            - "**/internal/call/**"
            - "**/internal/settings/**"
            - "**/internal/jsonl/**"
            - "**/internal/atomicfile/**"
            - "**/internal/userconfig/**"
            - "**/internal/classify/**"
            - "**/internal/markfile/**"
            - "**/internal/knowledge/**"
            - "**/internal/compact/**"
            - "**/internal/extract/**"
            - "**/internal/loop/**"
            - "**/internal/replay/**"
            - "**/internal/retain/**"
            - "**/internal/consolidate/**"
            - "**/internal/curate/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/textkey
              desc: the HMAC key reaches classify and curate only as the seal func the composition root passes
            - pkg: github.com/jeon-jihyeon/nodloop/internal/schema
              desc: only the composition roots and the transports read the published schemas
        application:
          files:
            - "**/internal/knowledge/**"
            - "**/internal/compact/**"
            - "**/internal/extract/**"
            - "**/internal/loop/**"
            - "**/internal/replay/**"
            - "**/internal/retain/**"
            - "**/internal/consolidate/**"
            - "**/internal/curate/**"
            - "!**/internal/knowledge/file/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/feedback/file
              desc: application code takes stores through its own interfaces and never a file store
            - pkg: github.com/jeon-jihyeon/nodloop/internal/trace/file
              desc: application code takes stores through its own interfaces and never a file store
            - pkg: github.com/jeon-jihyeon/nodloop/internal/knowledge/file
              desc: application code takes stores through its own interfaces and never a file store
            - pkg: github.com/jeon-jihyeon/nodloop/internal/veto/file
              desc: application code never reads veto files
            - pkg: github.com/jeon-jihyeon/nodloop/internal/settings/file
              desc: application code never edits settings files
            - pkg: github.com/jeon-jihyeon/nodloop/internal/jsonl
              desc: application code never touches the jsonl format
            - pkg: github.com/jeon-jihyeon/nodloop/internal/otel
              desc: application code never sends telemetry
            - pkg: github.com/jeon-jihyeon/nodloop/internal/datapackage
              desc: application code never writes a Data Package
            - pkg: github.com/jeon-jihyeon/nodloop/internal/guard
              desc: application packages do not import guard
            - pkg: github.com/jeon-jihyeon/nodloop/internal/mcp
              desc: application packages do not import mcp
            - pkg: github.com/jeon-jihyeon/nodloop/internal/testkit
              desc: only tests import the test harness
            - pkg: github.com/jeon-jihyeon/nodloop/cmd
              desc: nothing imports cmd
        knowledge:
          files:
            - "**/internal/knowledge/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: only mcp, cmd and the server import compact
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: only mcp, cmd and the server import extract
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: only mcp, cmd, the server and the nodloop package import loop
            - pkg: github.com/jeon-jihyeon/nodloop/internal/retain
              desc: only mcp, cmd, the server and the nodloop package import retain
            - pkg: github.com/jeon-jihyeon/nodloop/internal/consolidate
              desc: only cmd imports consolidate
            - pkg: github.com/jeon-jihyeon/nodloop/internal/replay
              desc: only cmd imports replay
            - pkg: github.com/jeon-jihyeon/nodloop/internal/curate
              desc: only mcp, cmd, the server and the nodloop package import curate
        compact:
          files:
            - "**/internal/compact/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: only mcp, cmd, the server and the nodloop package import loop
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: only mcp, cmd and the server import extract
            - pkg: github.com/jeon-jihyeon/nodloop/internal/replay
              desc: only cmd imports replay
            - pkg: github.com/jeon-jihyeon/nodloop/internal/retain
              desc: only mcp, cmd, the server and the nodloop package import retain
            - pkg: github.com/jeon-jihyeon/nodloop/internal/consolidate
              desc: only cmd imports consolidate
            - pkg: github.com/jeon-jihyeon/nodloop/internal/curate
              desc: only mcp, cmd, the server and the nodloop package import curate
        extract:
          files:
            - "**/internal/extract/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: extract and compact share only the ledger
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: only mcp, cmd, the server and the nodloop package import loop
            - pkg: github.com/jeon-jihyeon/nodloop/internal/replay
              desc: only cmd imports replay
            - pkg: github.com/jeon-jihyeon/nodloop/internal/retain
              desc: only mcp, cmd, the server and the nodloop package import retain
            - pkg: github.com/jeon-jihyeon/nodloop/internal/consolidate
              desc: only cmd imports consolidate
            - pkg: github.com/jeon-jihyeon/nodloop/internal/curate
              desc: only mcp, cmd, the server and the nodloop package import curate
        loop:
          files:
            - "**/internal/loop/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: loop reads records through knowledge only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: loop reads records through knowledge only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/llm
              desc: loop never calls a model
            - pkg: github.com/jeon-jihyeon/nodloop/internal/replay
              desc: loop reads replay traces as records only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/retain
              desc: only mcp, cmd, the server and the nodloop package import retain
            - pkg: github.com/jeon-jihyeon/nodloop/internal/consolidate
              desc: only cmd imports consolidate
            - pkg: github.com/jeon-jihyeon/nodloop/internal/curate
              desc: only mcp, cmd, the server and the nodloop package import curate
        replay:
          files:
            - "**/internal/replay/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: replay reads the ledger only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: replay reads the ledger only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: only mcp, cmd, the server and the nodloop package import loop
            - pkg: github.com/jeon-jihyeon/nodloop/internal/retain
              desc: only mcp, cmd, the server and the nodloop package import retain
            - pkg: github.com/jeon-jihyeon/nodloop/internal/consolidate
              desc: only cmd imports consolidate
            - pkg: github.com/jeon-jihyeon/nodloop/internal/curate
              desc: only mcp, cmd, the server and the nodloop package import curate
        retain:
          files:
            - "**/internal/retain/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: retain reads records through their stores only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: retain reads records through their stores only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: retain reads records through their stores only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/replay
              desc: retain reads records through their stores only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/llm
              desc: retain never calls a model
            - pkg: github.com/jeon-jihyeon/nodloop/internal/consolidate
              desc: only cmd imports consolidate
            - pkg: github.com/jeon-jihyeon/nodloop/internal/curate
              desc: only mcp, cmd, the server and the nodloop package import curate
        consolidate:
          files:
            - "**/internal/consolidate/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: consolidate reads the ledger only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: consolidate reads the ledger only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: only mcp, cmd, the server and the nodloop package import loop
            - pkg: github.com/jeon-jihyeon/nodloop/internal/replay
              desc: only cmd imports replay
            - pkg: github.com/jeon-jihyeon/nodloop/internal/retain
              desc: only mcp, cmd, the server and the nodloop package import retain
            - pkg: github.com/jeon-jihyeon/nodloop/internal/curate
              desc: only mcp, cmd, the server and the nodloop package import curate
        curate:
          files:
            - "**/internal/curate/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: curate reads the ledger and cmd composes it with compact
            - pkg: github.com/jeon-jihyeon/nodloop/internal/consolidate
              desc: only cmd imports consolidate
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: curate reads extract traces as records and cmd composes it with extract
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: cmd hands the numbers of loop to curate as plain values
            - pkg: github.com/jeon-jihyeon/nodloop/internal/replay
              desc: only cmd imports replay
            - pkg: github.com/jeon-jihyeon/nodloop/internal/retain
              desc: only mcp, cmd, the server and the nodloop package import retain
        guard:
          files:
            - "**/internal/guard/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/knowledge
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/replay
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/retain
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/consolidate
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/curate
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/mcp
              desc: guard does not import mcp
            - pkg: github.com/jeon-jihyeon/nodloop/internal/testkit
              desc: guard tests do not need the harness
            - pkg: github.com/jeon-jihyeon/nodloop/cmd
              desc: nothing imports cmd
        mcp:
          files:
            - "**/internal/mcp/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/feedback/file
              desc: mcp gets its stores from the composition root
            - pkg: github.com/jeon-jihyeon/nodloop/internal/trace/file
              desc: mcp gets its stores from the composition root
            - pkg: github.com/jeon-jihyeon/nodloop/internal/knowledge/file
              desc: mcp gets its stores from the composition root
            - pkg: github.com/jeon-jihyeon/nodloop/internal/guard
              desc: mcp does not import guard
            - pkg: github.com/jeon-jihyeon/nodloop/internal/testkit
              desc: only tests import the test harness
            - pkg: github.com/jeon-jihyeon/nodloop/cmd
              desc: nothing imports cmd
        testkit:
          files:
            - "**/internal/testkit/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/mcp
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/replay
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/retain
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/consolidate
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/curate
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/guard
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/cmd
              desc: nothing imports cmd
  exclusions:
    rules:
      # Tests and contract suites are scenarios and not units
      - path: (_test\.go|test/contract\.go)
        linters:
          - dupl
          - funlen
          - gocyclo
          - unparam
