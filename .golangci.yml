version: "2"
linters:
  enable:
    - depguard
    - dupl
    - funlen
    - gocritic
    - gocyclo
    - nakedret
    - revive
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 70
      statements: 50
    dupl:
      threshold: 120
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: comment-spacings
          disabled: true
        - name: exported
          disabled: true
    # Packages import downward only: domain → application → infra → controllers
    # knowledge is the ledger, compact and extract and loop sit above it and only mcp and cmd import them
    # No package imports a producer: a producer reaches the core through the MCP tools or the CLI
    # cmd/nodloop is the composition root and imports everything
    # Test files may reach the testkit harness and the file stores so $test is left out where that matters
    depguard:
      rules:
        domain:
          files:
            - "**/internal/feedback/**"
            - "**/internal/trace/**"
            - "**/internal/llm/**"
            - "**/internal/veto/**"
            - "**/internal/settings/**"
            - "**/internal/jsonl/**"
            - "**/internal/atomicfile/**"
            - "**/internal/classify/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/knowledge
              desc: domain packages do not import knowledge
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: domain packages do not import compact
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: domain packages do not import extract
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: domain packages do not import loop
            - pkg: github.com/jeon-jihyeon/nodloop/internal/guard
              desc: domain packages do not import guard
            - pkg: github.com/jeon-jihyeon/nodloop/internal/mcp
              desc: domain packages do not import mcp
            - pkg: github.com/jeon-jihyeon/nodloop/internal/testkit
              desc: domain packages do not import the test harness
            - pkg: github.com/jeon-jihyeon/nodloop/cmd
              desc: nothing imports cmd
        application:
          files:
            - "**/internal/knowledge/**"
            - "**/internal/compact/**"
            - "**/internal/extract/**"
            - "**/internal/loop/**"
            - "!**/internal/knowledge/file/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/feedback/file
              desc: application code takes stores through its own interfaces and never a file store
            - pkg: github.com/jeon-jihyeon/nodloop/internal/trace/file
              desc: application code takes stores through its own interfaces and never a file store
            - pkg: github.com/jeon-jihyeon/nodloop/internal/knowledge/file
              desc: application code takes stores through its own interfaces and never a file store
            - pkg: github.com/jeon-jihyeon/nodloop/internal/veto/file
              desc: application code never reads veto files
            - pkg: github.com/jeon-jihyeon/nodloop/internal/settings/file
              desc: application code never edits settings files
            - pkg: github.com/jeon-jihyeon/nodloop/internal/jsonl
              desc: application code never touches the jsonl format
            - pkg: github.com/jeon-jihyeon/nodloop/internal/pg
              desc: application code takes stores through its own interfaces and never the Postgres store
            - pkg: github.com/jeon-jihyeon/nodloop/internal/guard
              desc: application packages do not import guard
            - pkg: github.com/jeon-jihyeon/nodloop/internal/mcp
              desc: application packages do not import mcp
            - pkg: github.com/jeon-jihyeon/nodloop/internal/testkit
              desc: only tests import the test harness
            - pkg: github.com/jeon-jihyeon/nodloop/cmd
              desc: nothing imports cmd
        knowledge:
          files:
            - "**/internal/knowledge/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: only mcp and cmd import compact
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: only mcp and cmd import extract
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: only mcp and cmd import loop
        compact:
          files:
            - "**/internal/compact/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: only mcp and cmd import loop
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: only mcp and cmd import extract
        extract:
          files:
            - "**/internal/extract/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: extract and compact share only the ledger
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: only mcp and cmd import loop
        loop:
          files:
            - "**/internal/loop/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: loop reads records through knowledge only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: loop reads records through knowledge only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/llm
              desc: loop never calls a model
        guard:
          files:
            - "**/internal/guard/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/knowledge
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: the hook needs vetoes only
            - pkg: github.com/jeon-jihyeon/nodloop/internal/mcp
              desc: guard does not import mcp
            - pkg: github.com/jeon-jihyeon/nodloop/internal/testkit
              desc: guard tests do not need the harness
            - pkg: github.com/jeon-jihyeon/nodloop/cmd
              desc: nothing imports cmd
        mcp:
          files:
            - "**/internal/mcp/**"
            - "!$test"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/feedback/file
              desc: mcp gets its stores from the composition root
            - pkg: github.com/jeon-jihyeon/nodloop/internal/trace/file
              desc: mcp gets its stores from the composition root
            - pkg: github.com/jeon-jihyeon/nodloop/internal/knowledge/file
              desc: mcp gets its stores from the composition root
            - pkg: github.com/jeon-jihyeon/nodloop/internal/guard
              desc: mcp does not import guard
            - pkg: github.com/jeon-jihyeon/nodloop/internal/testkit
              desc: only tests import the test harness
            - pkg: github.com/jeon-jihyeon/nodloop/cmd
              desc: nothing imports cmd
        testkit:
          files:
            - "**/internal/testkit/**"
          deny:
            - pkg: github.com/jeon-jihyeon/nodloop/internal/compact
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/extract
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/loop
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/mcp
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/internal/guard
              desc: the harness opens stores and never a module under test
            - pkg: github.com/jeon-jihyeon/nodloop/cmd
              desc: nothing imports cmd
  exclusions:
    rules:
      # Tests and contract suites are scenarios and not units
      - path: (_test\.go|test/contract\.go)
        linters:
          - dupl
          - funlen
          - gocyclo
          - unparam
