name: Feature request
description: Something the loop should do that it does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you tried to do
      description: The correction, knowledge or guard situation where nodloop fell short
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would expect
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A trace id, a `report loop` line or a transcript excerpt that shows the gap
