name: server-release

# go install of nodloop-server resolves the server/v* tag outside go.work
# The tag is valid only when server/go.mod requires a core release that holds every API the server uses
on:
  push:
    tags:
      - "server/v*"

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
