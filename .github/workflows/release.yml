name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Write access stays on the one job that publishes
    permissions:
      contents: write
      # Signs the build provenance through the GitHub OIDC token
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # goreleaser writes an SPDX SBOM per archive with syft
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `gh attestation verify <archive> --repo jeon-jihyeon/nodloop` checks an archive was built here from the tag
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      # The same provenance as a release asset for readers without gh such as OpenSSF Scorecard
      - name: Attach the provenance
        run: |
          cp "$BUNDLE" dist/nodloop.intoto.jsonl
          gh release upload "$TAG" dist/nodloop.intoto.jsonl
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
