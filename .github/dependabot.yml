version: 2
# A week of cooldown like exclude-newer in sdk/python, so a compromised release has time to be pulled first
updates:
  - package-ecosystem: gomod
    directories: ["/", "/server"]
    schedule:
      interval: weekly
    # go.mod stays at go 1.25 for the MCP SDK and the contributors on that toolchain
    # mvdan.cc/sh 3.14 needs go 1.26 so it waits until the floor moves
    ignore:
      - dependency-name: mvdan.cc/sh/v3
        versions: [">=3.14.0"]
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /sdk/python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      typescript:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
