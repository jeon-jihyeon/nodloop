[project]
name = "nodloop"
version = "0.6.6"
description = "Record AI runs and the verdicts people give on them, and hand the knowledge they approve to the next run in the same place"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=1.25"]

[project.optional-dependencies]
langchain = ["langchain>=1.0"]
openai-agents = ["openai-agents>=0.3.3"]
claude-agent = ["claude-agent-sdk>=0.1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "langchain>=1.0", "openai-agents>=0.3.3", "claude-agent-sdk>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodloop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
