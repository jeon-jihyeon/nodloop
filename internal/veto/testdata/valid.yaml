vetoes:
  - id: no-sed-inplace
    tool: Bash
    when:
      - field: command
        match: '(^|[;&|]\s*)(sed|perl)\s+(-[a-zA-Z]*i|--in-place)'
    reason: sed -i and perl -i are forbidden. Use the Edit tool to modify files
    source: session 24a71b10 on 2026-09-22
  - id: no-readme
    tool: Write|Edit
    when:
      - field: file_path
        match: '(^|/)README\.md$'
        unless: 'node_modules/'
    reason: Do not create README files
    enabled: true
