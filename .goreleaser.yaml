version: 2

builds:
  - id: nodloop
    main: ./cmd/nodloop
    binary: nodloop
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  # The server module builds from its own directory, against the core of the same commit through go.work
  - id: nodloop-server
    dir: server
    main: ./cmd/nodloop-server
    binary: nodloop-server
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

# The plugin launcher downloads nodloop_{os}_{arch}.tar.gz and checksums.txt from the release tagged v<plugin.json version>
# The v* tag must equal the version in plugin/.claude-plugin/plugin.json
archives:
  - id: nodloop
    ids: [nodloop]
    formats: [tar.gz]
    name_template: "nodloop_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
  - id: nodloop-server
    ids: [nodloop-server]
    formats: [tar.gz]
    name_template: "nodloop-server_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

# One SPDX SBOM of syft per archive, attached to the release next to it
sboms:
  - artifacts: archive

release:
  draft: false
