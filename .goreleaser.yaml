version: 2

builds:
  - main: ./cmd/nodloop
    binary: nodloop
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

# The plugin launcher downloads nodloop_{os}_{arch}.tar.gz and checksums.txt from the release tagged v<plugin.json version>
# The v* tag must equal the version in plugin/.claude-plugin/plugin.json
archives:
  - formats: [tar.gz]
    name_template: "nodloop_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

release:
  draft: false
